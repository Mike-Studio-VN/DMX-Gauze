appId: com.dmxgauze.app
productName: DMX Gauze
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: build/icon.png
    to: app-icon.png
mac:
  icon: icon.icns
  category: public.app-category.utilities
  identity: null
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
win:
  icon: icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  artifactName: ${productName}-${version}-win-${arch}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: DMX Gauze
portable:
  artifactName: ${productName}-${version}-win-${arch}-portable.${ext}
