name: Build Release (Windows & macOS)

on:
  workflow_dispatch:
    inputs:
      validate_ref:
        description: 'Optional ref/tag/SHA (e.g. v1.0.1) for validation-only check without publishing or uploading artifacts'
        required: false
        type: string
      validation_only:
        description: 'Validation-only mode: run tests/builds/package verification without uploading Actions artifacts'
        required: false
        default: false
        type: boolean
  pull_request:
    branches:
      - main
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        if: github.event_name != 'workflow_dispatch' || inputs.validate_ref == ''
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch' && inputs.validate_ref != ''
        with:
          ref: ${{ inputs.validate_ref }}
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch' && inputs.validate_ref != ''
        with:
          ref: ${{ github.sha }}
          path: ci-harness
      - name: Apply Windows-safe test harness from CI branch when validating target ref
        if: github.event_name == 'workflow_dispatch' && inputs.validate_ref != ''
        shell: bash
        run: |
          cp ci-harness/src/main/serialDriver.test.ts src/main/serialDriver.test.ts
          cp ci-harness/src/main/driverIntegration.test.ts src/main/driverIntegration.test.ts
          rm -rf ci-harness
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test
      - run: npm run build && npx --no-install electron-builder --win --publish never
      - name: Verify packaged Windows installers
        shell: bash
        run: |
          shopt -s nullglob
          files=(release/*/*.exe)
          test "${#files[@]}" -eq 2
          for f in "${files[@]}"; do test -s "$f"; done
          ls -lh "${files[@]}"
      - name: Upload Windows assets to Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes || true
          gh release upload "${GITHUB_REF_NAME}" release/*/*.exe --clobber
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.validation_only && inputs.validate_ref == '')
        with:
          name: dmx-gauze-windows
          path: release/**/*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        if: github.event_name != 'workflow_dispatch' || inputs.validate_ref == ''
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch' && inputs.validate_ref != ''
        with:
          ref: ${{ inputs.validate_ref }}
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch' && inputs.validate_ref != ''
        with:
          ref: ${{ github.sha }}
          path: ci-harness
      - name: Apply Windows-safe test harness from CI branch when validating target ref
        if: github.event_name == 'workflow_dispatch' && inputs.validate_ref != ''
        shell: bash
        run: |
          cp ci-harness/src/main/serialDriver.test.ts src/main/serialDriver.test.ts
          cp ci-harness/src/main/driverIntegration.test.ts src/main/driverIntegration.test.ts
          rm -rf ci-harness
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test
      - run: npm run build && npx --no-install electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged macOS installers
        run: |
          shopt -s nullglob
          files=(release/*/*.dmg release/*/*.zip)
          test "${#files[@]}" -eq 4
          for f in "${files[@]}"; do test -s "$f"; done
          ls -lh "${files[@]}"
      - name: Upload macOS assets to Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes || true
          gh release upload "${GITHUB_REF_NAME}" release/*/*.dmg release/*/*.zip --clobber
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.validation_only && inputs.validate_ref == '')
        with:
          name: dmx-gauze-macos
          path: |
            release/**/*.dmg
            release/**/*.zip
